<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherPaste</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=JetBrains+Mono:wght@300&display=swap');

        :root {
            --accent: #6366f1;
            --bg: #080a0f;
            --card: rgba(17, 25, 40, 0.75);
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
        }

        /* Advanced Glassmorphism */
        .glass-panel {
            background: var(--card);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        /* Animated Input Glow */
        .glow-input {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(0, 0, 0, 0.3);
        }

        .glow-input:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
        }

        /* Hyper-Modern Button */
        .btn-aether {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-aether::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .btn-aether:hover::after {
            left: 100%;
        }

        .btn-aether:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Floating Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .float-anim { animation: float 6s ease-in-out infinite; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <header class="w-full max-w-6xl flex justify-between items-center mb-16">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 glass-panel flex items-center justify-center float-anim">
                <div class="w-4 h-4 bg-indigo-500 rounded-full animate-pulse"></div>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-500">
                Aether<span class="text-indigo-500">Paste</span>
            </h1>
        </div>
        <div class="text-[10px] tracking-[0.4em] text-gray-500 font-bold uppercase hidden md:block">
            System Status: 8003 // Deployment Ready
        </div>
    </header>

    <main class="w-full max-w-5xl">
        
        <!-- Creation Section -->
        <div id="create-section" class="animate-in fade-in slide-in-from-bottom-8 duration-1000">
            <div class="glass-panel p-1">
                <div class="glow-input rounded-[22px] overflow-hidden">
                    <textarea id="pasteInput" 
                        class="w-full min-h-[500px] bg-transparent p-10 outline-none text-lg font-light leading-relaxed mono placeholder:text-gray-700"
                        placeholder="// Enter your content..."></textarea>
                </div>
            </div>

            <div class="mt-12 flex flex-col md:flex-row items-center gap-8">
                <button id="createBtn" onclick="createPaste()" 
                    class="btn-aether text-white font-bold py-5 px-12 rounded-2xl text-xs uppercase tracking-widest">
                    Initialize Imprint
                </button>

                <div id="resultBox" class="hidden flex-grow group">
                    <div class="glass-panel py-4 px-8 flex items-center justify-between border-indigo-500/20">
                        <span id="shareableLink" class="text-xs font-light text-indigo-300 truncate pr-4"></span>
                        <button onclick="copyLink()" class="text-white font-bold text-[10px] uppercase hover:text-indigo-400 transition">Copy_Link</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- View Section -->
        <div id="view-section" class="hidden animate-in zoom-in-95 duration-700">
            <div class="flex justify-between items-end mb-6 px-4">
                <div>
                    <h2 class="text-2xl font-bold">Stored Data</h2>
                    <p class="text-xs text-gray-500 mt-1 mono" id="pasteIdLabel"></p>
                </div>
                <button onclick="window.location.search = ''" class="text-xs text-indigo-400 hover:underline">New Instance</button>
            </div>
            <div class="glass-panel p-10">
                <pre id="displayArea" class="mono text-sm leading-8 text-gray-300 whitespace-pre-wrap"></pre>
            </div>
        </div>

    </main>

    <footer class="mt-20 p-10 text-center opacity-30">
        <p class="text-[9px] uppercase tracking-[1em]">Aditya Prakash Sinha || 2026</p>
    </footer>

    <script>
        const API_BASE_URL = 'https://pastebin-clone-r0dv.onrender.com';

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) fetchPaste(id);
        });

        async function createPaste() {
            const content = document.getElementById('pasteInput').value;
            const btn = document.getElementById('createBtn');
            if (!content.trim()) return;

            btn.disabled = true;
            btn.innerText = "PROCESSING...";

            try {
                const response = await fetch(`${API_BASE_URL}/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content }) // Matches genPasteId controller[cite: 4, 6]
                });
                const data = await response.json();
                if (response.ok) {
                    const fullLink = `${window.location.origin}${window.location.pathname}?id=${data.pasteID}`;
                    document.getElementById('shareableLink').textContent = fullLink;
                    document.getElementById('resultBox').classList.remove('hidden');
                    btn.innerText = "IMPRINTED";
                }
            } catch (err) {
                btn.innerText = "ERROR";
            } finally {
                btn.disabled = false;
            }
        }

        async function fetchPaste(id) {
            try {
                const response = await fetch(`${API_BASE_URL}/${id}`);
                const data = await response.json();
                if (response.status === 200) {
                    document.getElementById('create-section').classList.add('hidden');
                    document.getElementById('view-section').classList.remove('hidden');
                    document.getElementById('displayArea').textContent = data.message; // Based on schema.pasteNote[cite: 1, 5]
                    document.getElementById('pasteIdLabel').textContent = `DESCRIPTOR // ${id}`;
                }
            } catch (err) {
                console.error("Communication failure.");
            }
        }

        function copyLink() {
            navigator.clipboard.writeText(document.getElementById('shareableLink').textContent);
            alert("Reference link copied.");
        }
    </script>
</body>
</html>
